spring.application.name=team-3trim-commerce-payment-project

# MySQL (env vars can override defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:commercepayment}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA defaults for local development
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.sql.init.mode=${SQL_INIT:always}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api/v1

# encoder.strenth=${STRENGTH:10}

jwt.secret=${JWT_SECRET}
jwt.expire-time=${JWT_EXPIRE_TIME}

portone.store-id=${STORE_ID}
portone.api-secret=${PORTONE_API_SECRET}